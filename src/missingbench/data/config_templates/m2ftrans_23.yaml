# Combined M2FTrans reference config for BraTS 2023.
# This mirrors legacy M2FTrans defaults under the current MissingBench CLI/config API.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/m2ftrans-preprocessed/
dataset_type: brats23

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/m2ftrans-preprocessed
art_dir: /path/to/artifacts/m2ftrans23
results_dir: /path/to/results/m2ftrans_23

trainer: imfuse
model: m2ftrans
loss: imfuse

custom_model_kwargs:
  num_cls: 4

custom_loss_kwargs:
  fuse_weight: 1.0
  sep_weight: 1.0
  prm_weight: 1.0
  eps: 0.001
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  region_fusion_start_epoch: 0
  patch_size: 80
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation

optimizer: adamw
betas: [0.9, 0.999]
momentum: 0.9
amsgrad: true

scheduler: warmuppoly
poly_total_iters: 1000
poly_power: 0.9
warmuppoly_warmup_iters: 100
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0003
num_epochs: 1000
validation_every: 10
batch_size: 6
weight_decay: 0.0001
num_workers: 8
precision: fp16
compile: false


resume: false
pretrain: null
seed: 0

fold: 1
wandb_project: MissingBench
wandb_entity: null
wandb_mode: online
wandb_run_name: m2ftrans23
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/m2ftrans23/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/m2ftrans_23/results.txt
