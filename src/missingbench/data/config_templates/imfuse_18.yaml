# Combined IMFuse reference config for BraTS 2023.
# This mirrors legacy IMFuse defaults as closely as possible under the current
# MissingBench CLI/config API.
#
# Note: the current CLI still expects command-specific flat YAML files, so this
# combined file is a reference/source-of-truth file rather than a single file
# both commands can consume directly.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/imfuse-preprocessed/
dataset_type: brats18

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/imfuse-preprocessed
art_dir: /path/to/artifacts/imfuse18
results_dir: /path/to/results/imfuse_18

trainer: imfuse
model: imfuse
loss: imfuse

custom_model_kwargs:
  interleaved_tokenization: true
  mamba_skip: true
  num_cls: 4

custom_loss_kwargs:
  num_classes: null
  fuse_weight: 1.0
  sep_weight: 1.0
  prm_weight: 1.0
  eps: 0.001
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  region_fusion_start_epoch: 0
  patch_size: 128
  debug: false
  transform_kind: imfuse

optimizer: radam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 1000
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0004
num_epochs: 1000
validation_every: 10
batch_size: 2
weight_decay: 0.00003
num_workers: 16
precision: fp32
compile: false

resume: false
pretrain: null
seed: 0

fold: 1
wandb_project: MissingBench
wandb_entity: null
wandb_mode: online
wandb_run_name: imfuse18
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo
# testing
checkpoint_path: /path/to/artifacts/imfuse18/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/imfuse_18/results.txt
