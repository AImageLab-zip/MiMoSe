# Combined U-HVED reference config for BraTS 2018.
# This mirrors legacy U-HVED defaults as closely as possible under the current
# MissingBench CLI/config API.
#
# Note: the current CLI still expects command-specific flat YAML files, so this
# combined file is a reference/source-of-truth file rather than a single file
# both commands can consume directly.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/uhved-preprocessed/
dataset_type: brats18

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/uhved-preprocessed
art_dir: /path/to/artifacts/uhved18
results_dir: /path/to/results/uhved_18

trainer: uhved
model: uhved
loss: uhved

custom_model_kwargs:
  num_cls: 4
  test_time_samples: 10

custom_loss_kwargs:
  num_classes: null
  eps: 1.0e-7
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  patch_size: 112
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation
  mask_sampling: count_uniform
  final_from_best: true
  grad_clip_norm: null
  skip_nonfinite_loss: true

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: step
poly_total_iters: null
poly_power: null
cosine_t_max: null
cosine_eta_min: null
step_step_size: 50
step_gamma: 0.25
multistep_milestones: null
multistep_gamma: null
plateau_mode: min
plateau_factor: 0.1
plateau_patience: 10

lr: 0.001
num_epochs: 300
validation_every: 10
batch_size: 1
weight_decay: 0.00001
num_workers: 8
precision: fp32
compile: false

resume: false
pretrain: null
seed: 0

fold: 1
wandb_project: MissingBench
wandb_entity: null
wandb_mode: online
wandb_run_name: uhved18
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/uhved18/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/uhved_18/results.txt
