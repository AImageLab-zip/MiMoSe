# Combined SRMNet reference config for BraTS 2018.
# This mirrors legacy SRMNet defaults as closely as possible under the
# current MissingBench CLI/config API.
#
# Note: the current CLI still expects command-specific flat YAML files, so this
# combined file is a reference/source-of-truth file rather than a single file
# both commands can consume directly.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/srmnet-preprocessed/
dataset_type: brats18

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/srmnet-preprocessed
art_dir: /path/to/artifacts/srmnet18
results_dir: /path/to/results/srmnet_18

trainer: srmnet
model: srmnet
loss: srmnet

custom_model_kwargs:
  num_cls: 4

custom_loss_kwargs:
  num_classes: null
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  patch_size: 128
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 1000
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0008
num_epochs: 1000
validation_every: 10
batch_size: 4
weight_decay: 0.0001
num_workers: 8
precision: fp16
compile: false

resume: false
pretrain: null
seed: 0

fold: 1
wandb_project: MissingBench
wandb_entity: null
wandb_mode: online
wandb_run_name: srmnet18
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/srmnet18/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/srmnet_18/results.txt
