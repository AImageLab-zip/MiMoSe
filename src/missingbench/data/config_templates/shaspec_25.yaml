# Combined ShaSpec reference config for BraTS 2025.
# This mirrors legacy ShaSpec defaults as closely as possible under the
# current MissingBench CLI/config API.
#
# Legacy trains ShaSpec as two train_SS.py runs: a full-modality warmup, then a
# second run (--mode random) that resumes the optimizer and continues the same
# poly schedule. ShaSpecTrainer reproduces that within one run:
# warmup_fraction of num_epochs uses all modalities, then train_masking_mode;
# optimizer state and the poly schedule carry over. Upstream recipe: SGD
# (Nesterov, momentum 0.99), lr 1e-2, no weight decay, fp32, foreground-biased
# crops with scale/mirror augmentation (transform_kind: shaspec).
#
# Note: the current CLI still expects command-specific flat YAML files, so this
# combined file is a reference/source-of-truth file rather than a single file
# both commands can consume directly.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/shaspec-preprocessed/
dataset_type: brats25

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/shaspec-preprocessed
art_dir: /path/to/artifacts/shaspec25
results_dir: /path/to/results/shaspec_25

trainer: shaspec
model: shaspec
loss: shaspec

custom_model_kwargs:
  num_cls: 5

custom_loss_kwargs:
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  patch_size: 80
  debug: false
  transform_kind: shaspec
  train_masking_mode: random
  val_masking_mode: validation
  warmup_fraction: 0.44
  mask_sampling: count_uniform
  restart_schedule_at_warmup_end: false
  grad_clip_norm: null
  skip_nonfinite_loss: true

optimizer: sgd
betas: [0.9, 0.999]
momentum: 0.99
nesterov: true

scheduler: poly
poly_total_iters: 600
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.01
num_epochs: 600
validation_every: 10
batch_size: 2
weight_decay: 0.0
num_workers: 8
precision: fp32
compile: false

resume: false
pretrain: null
seed: 0

fold: 1
wandb_project: MissingBench
wandb_entity: null
wandb_mode: online
wandb_run_name: shaspec25
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/shaspec25/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/shaspec_25/results.txt
