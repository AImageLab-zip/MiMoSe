# Combined NAP-SCAF reference config for BraTS 2018.
# This reproduces the legacy NAP-SCAF recipe (legacy/NAP-SCAF/scripts/
# preprocess_brats_png.py + train_brats.py + evaluate_brats.py):
#   - preprocessing: full 240x240 axial slices (no crop), each normalised on its
#     own: clip to its 1st/99th percentile (background included), scale to
#     uint8, /255 (norm_mode slice_percentile_uint8);
#   - training data: a fixed set of at most 5 tumor slices per case (every
#     modality >= 5% nonzero), drawn once with seed 7, resized to 256x256;
#     batches of 16 shuffled slices; no augmentation;
#   - all four modalities present during training (train_masking_mode: full);
#     missing modalities are only zero-filled at evaluation, as in legacy;
#   - AdamW(lr 1e-4, wd 1e-4, betas (0.9, 0.99)), constant lr, 150 epochs, AMP for
#     training only (validation and test in fp32); validation every epoch and the
#     best validation checkpoint is the one tested.
# Inference resizes every 240x240 slice to 256x256 and the logits back.
# Deviations kept: the 80/20 random slice split is replaced by the shared fold
# split, validation is volumetric (random modality subsets) instead of on full-
# modality 2D slices, and the train loader drops its last incomplete batch.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/napscaf-legacy-preprocessed/
dataset_type: brats18

crop_mode: none
crop_size: null
crop_min_size: null

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: slice_percentile_uint8
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/napscaf-legacy-preprocessed
art_dir: /path/to/artifacts/napscaf18
results_dir: /path/to/results/napscaf_18

trainer: napscaf
model: napscaf
loss: napscaf

custom_model_kwargs:
  num_cls: 4
  mid_channels: 16
  stages: 4
  gate_passes: 2
  # ImageNet DenseNet121 weights for the (never-trained, as in legacy) prior encoder.
  pretrained_prior: true
  slice_chunk: 32
  # Legacy evaluates 256x256 slices (240x240 resized).
  inference_size: 256

custom_loss_kwargs:
  num_classes: null
  ce_weight: 0.5
  dice_weight: 0.5

custom_trainer_kwargs:
  iter_per_epoch: null
  patch_size: 128
  # Legacy fixed slice set: <= 5 tumor slices per case (seed 7), full slices resized to 256.
  legacy_slices: true
  slices_per_case: 5
  slice_seed: 7
  min_nonzero_ratio: 0.05
  slice_size: 256
  final_from_best: true
  fp32_validation: true
  debug: false
  transform_kind: imfuse
  train_masking_mode: full
  val_masking_mode: validation
  grad_clip_norm: null
  skip_nonfinite_loss: true

# Legacy: AdamW(lr=1e-4, weight_decay=1e-4, betas=(0.9, 0.99)) with a constant learning rate.
optimizer: adamw
betas: [0.9, 0.99]
momentum: 0.9

# step with gamma 1.0 keeps the learning rate constant, as in legacy.
scheduler: step
poly_total_iters: null
poly_power: null
warmuppoly_warmup_iters: null
cosine_t_max: null
cosine_eta_min: null
step_step_size: 50
step_gamma: 1.0
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0001
num_epochs: 150
validation_every: 1
batch_size: 16
weight_decay: 0.0001
num_workers: 8
# Legacy's README trains with --amp.
precision: fp16
compile: false

resume: false
pretrain: null
seed: 0

fold: 1
wandb_project: MiMoSe
wandb_entity: null
wandb_mode: online
wandb_run_name: napscaf18
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/napscaf18/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/napscaf_18/results.txt
