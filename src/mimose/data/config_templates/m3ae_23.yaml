# Combined M3AE reference config for BraTS 2023.
# Same logic as legacy M3AE (legacy/m3ae, README commands), as one run:
# - data: per-modality 1-99 percentile clip of the positive voxels + min-max to
#   [0, 1] (legacy irm_min_max_preprocess; norm_mode: irm_min_max); uniform
#   random 128^3 crops whose location slices the full-volume `limage`.
# - pretraining (legacy pretrain.py, first 600 of 900 epochs): 2 crops per step
#   (pretrain_samples_per_step), 87.5% of 16^3 tokens plus up to 3 whole
#   modalities masked and filled from `limage`, MSE reconstruction + 0.005 *
#   `limage` norm; Adam lr 3e-4 (limage 0.005), wd 0, cosine over 600 epochs.
# - fine-tuning (legacy train.py, last 300 epochs): fresh Adam lr 3e-4, wd 1e-4,
#   cosine over 300 epochs, `limage` frozen; each sample is duplicated into 2
#   independently modality-masked views, filled from `limage`, then augmented
#   (per-slice/channel intensity shift+scale, random flips); 3 sigmoid region
#   heads [ET, TC, WT] with deep supervision, EDiceLoss (0.7 Dice + 0.3 BCE)
#   summed over [out4, out3, uout] + 0.1 * MSE(out4 view 1, out4 view 2).
# - test: best-validation weights (final_from_best), sliding window averaging
#   region logits, regions thresholded at 0.5 and nested into BraTS labels.
# Deviations: `limage` is sliced in brain-bbox coordinates in both training and
# testing (legacy trains in absolute and tests in bbox coordinates); each
# dataset is pretrained on itself (legacy reused its BraTS 2023 pretraining).
#
# Note: the current CLI still expects command-specific flat YAML files, so this
# combined file is a reference/source-of-truth file rather than a single file
# both commands can consume directly.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/m3ae-legacy-preprocessed/
dataset_type: brats23

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: irm_min_max
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/m3ae-legacy-preprocessed
art_dir: /path/to/artifacts/m3ae23
results_dir: /path/to/results/m3ae_23

trainer: m3ae
model: m3ae
loss: m3ae

custom_model_kwargs:
  num_cls: 4
  num_regions: 3
  template_shape: [240, 240, 155]

custom_loss_kwargs:
  num_classes: null

custom_trainer_kwargs:
  iter_per_epoch: null
  patch_size: 128
  debug: false
  train_masking_mode: random
  val_masking_mode: validation
  # legacy MaskEmbeeding1(mdp=3): drop U{0..3} modalities.
  mask_sampling: count_uniform
  pretrain_fraction: 0.6666666666666666
  pretrain_samples_per_step: 2
  limage_lr: 0.005
  limage_reg_weight: 0.005
  pretrain_weight_decay: 0.0
  mae_patch_masking: true
  mae_mask_ratio: 0.875
  mae_mdp: 3
  views: 2
  consistency_weight: 0.1
  legacy_augment: true
  final_from_best: true
  grad_clip_norm: null
  skip_nonfinite_loss: true

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: cosine
poly_total_iters: null
poly_power: null
cosine_t_max: 600
cosine_eta_min: 0.0
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0003
num_epochs: 900
validation_every: 10
batch_size: 1
weight_decay: 0.0001
num_workers: 8
precision: fp32
compile: false

resume: false
pretrain: null
seed: 0

fold: 1
wandb_project: MiMoSe
wandb_entity: null
wandb_mode: online
wandb_run_name: m3ae23
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/m3ae23/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/m3ae_23/results.txt
