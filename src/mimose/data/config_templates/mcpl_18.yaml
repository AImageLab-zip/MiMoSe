# Combined MCPL reference config for BraTS 2018.
# Same logic as legacy MCPL (legacy/MCPL pretrain.py / train.py), as one run:
# - data: per-modality z-score of the nonzero voxels, background kept at 0
#   (legacy zscore_normalise; norm_mode: subject_zscore_nonzero); uniform
#   random 128^3 crops; missing modalities filled with frozen zeros.
# - pretraining (first 600 of 1100 epochs): 2 crops per step, 87.5% of 16^3
#   tokens plus up to 3 whole modalities masked, MSE reconstruction through the
#   modality prototypes + 0.01 * modality contrast; Adam lr 3e-4, wd 0, cosine
#   over 600 epochs.
# - fine-tuning (last 500 epochs): fresh Adam lr 3e-4, wd 1e-4, cosine over 500
#   epochs; each sample duplicated into 2 independently modality-masked views,
#   filled, then augmented (per-slice/channel intensity, random flips); 3 region
#   prototypes [ET, TC, WT] (CC_classes = 3), the raw voxel-prototype cosine is
#   the sigmoid logit; EDiceLoss (0.7 Dice + 0.3 BCE) without deep supervision
#   (legacy default), + 0.01 * class contrast, + 0.1 * legacy's consistency MSE,
#   which (without deep supervision) compares the ET and TC maps of view 1.
# - test: best-validation weights (final_from_best), sliding window averaging
#   region logits, regions thresholded at 0.5 and nested into BraTS labels.
#
# Note: the current CLI still expects command-specific flat YAML files, so this
# combined file is a reference/source-of-truth file rather than a single file
# both commands can consume directly.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/mcpl-legacy-preprocessed/
dataset_type: brats18

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore_nonzero
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/mcpl-legacy-preprocessed
art_dir: /path/to/artifacts/mcpl18
results_dir: /path/to/results/mcpl_18

trainer: mcpl
model: mcpl
loss: mcpl

custom_model_kwargs:
  num_cls: 4
  cc_modalities: 4
  cc_classes: 3
  layers: 6
  learnable_filler: false
  logit_scale: 1.0

custom_loss_kwargs:
  num_classes: null

custom_trainer_kwargs:
  iter_per_epoch: null
  patch_size: 128
  debug: false
  train_masking_mode: random
  val_masking_mode: validation
  # legacy MaskEmbeeding1(mdp=3): drop U{0..3} modalities.
  mask_sampling: count_uniform
  pretrain_fraction: 0.5454545454545454
  pretrain_samples_per_step: 2
  limage_lr: 0.005
  pretrain_weight_decay: 0.0
  mae_patch_masking: true
  mae_mask_ratio: 0.875
  mae_mdp: 3
  views: 2
  deep_supervised: false
  consistency_weight: 0.1
  class_contrast_weight: 0.01
  modal_contrast_weight: 0.01
  cc_modalities: 4
  legacy_augment: true
  final_from_best: true
  grad_clip_norm: null
  skip_nonfinite_loss: true

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: cosine
poly_total_iters: null
poly_power: null
cosine_t_max: 600
cosine_eta_min: 0.0
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0003
num_epochs: 1100
validation_every: 10
batch_size: 1
weight_decay: 0.0001
num_workers: 8
precision: fp32
compile: false

resume: false
pretrain: null
seed: 0

fold: 1
wandb_project: MiMoSe
wandb_entity: null
wandb_mode: online
wandb_run_name: mcpl18
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/mcpl18/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/mcpl_18/results.txt
