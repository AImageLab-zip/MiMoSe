# nasflops_b06_23 = step 3 (realized, trained from scratch) for b06: 205G MACs, BraTS23.
# Architectures from the fold's gated search (realized.json). Same recipe as nasunif_b06_23:
# batch 20 x 1 GPU(s), lr 0.002, 1000 epochs.
# Generated by scripts/nasflops.py -- DO NOT EDIT BY HAND.

# preprocess (identical to the mimosa_[size] sweep)
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/mimosa_preprocessed/
dataset_type: brats23
crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]
clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null
norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null
yes: null

# training
data_dir: /path/to/preprocessed/mimosa_preprocessed
art_dir: /path/to/artifacts/nasflopsb0623
results_dir: /path/to/results/nasflops_b06_23

trainer: imfuse
model: simpleunet
loss: tinymimosa

custom_model_kwargs:
  num_cls: 4
  input_shape: [128, 128, 128]

# One architecture per fold: each was searched on that fold's own
# train/val split (nested CV), so no fold's test subjects chose its model.
custom_model_kwargs_per_fold:
  1:
    features_per_stage: [22, 40, 82, 116, 484]
    gradient_checkpointing: false

custom_loss_kwargs:
  dice_weight: 0.5
  ce_weight: 0.5
  eps: 0.001

custom_trainer_kwargs:
  transform_kind: imfuse
  patch_size: 128
  train_masking_mode: random
  val_masking_mode: validation

# optimizer/schedule: what the mimosa_[size] configs actually ran
optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9
scheduler: poly
poly_total_iters: 1000
poly_power: 0.9

lr: 0.002
num_epochs: 1000
validation_every: 10
batch_size: 20
weight_decay: 0.0001
num_workers: 8
# fp16 mixed precision, as the mimosa_[size] runs trained (their `fp16: true`;
# the memory/time models are fitted on those runs).
precision: fp16
compile: false

resume: false
pretrain: null
seed: 0

fold: 1
wandb_project: MiMoSe-NAS
wandb_entity: null
wandb_mode: online
wandb_run_name: nasflops_b06_23
push_to_hf: true
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/nasflopsb0623/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/nasflops_b06_23/results.txt
